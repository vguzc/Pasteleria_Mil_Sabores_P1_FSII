<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Pastelería Mil Sabores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/formularios.css">
</head>
<body>

    <header class="main-header">
        <h1>Pastelería Mil Sabores 🎂</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="registro.html" class="active">Registro</a>
            <a href="login.html">Ingresar</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main class="form-container">
        <h2>Crear Cuenta & Obtener Beneficios</h2>
        <p class="form-subtitle">¡Inscríbete y accede a descuentos por edad, código promocional y beneficio Duoc!</p>

        <form id="formRegistro" novalidate>
            <div class="form-group">
                <label for="run">RUN (sin puntos ni guion):</label>
                <input type="text" id="run" name="run" placeholder="Ej: 19876543k" maxlength="9" required>
                <span class="error-msg" id="errorRun"></span>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                    <span class="error-msg" id="errorNombre"></span>
                </div>
                <div class="form-group">
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" name="apellidos" placeholder="Tus apellidos" required>
                    <span class="error-msg" id="errorApellidos"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@gmail.com o @duoc.cl" required>
                    <span class="error-msg" id="errorCorreo"></span>
                </div>
                <div class="form-group">
                    <label for="fechaNacimiento">Fecha de Nacimiento:</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
                    <span class="error-msg" id="errorFecha"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="direccion">Dirección Calle y Número:</label>
                <input type="text" id="direccion" name="direccion" placeholder="Av. Siempre Viva 123" required>
                <span class="error-msg" id="errorDireccion"></span>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="selectRegion">Región:</label>
                    <select id="selectRegion" name="region" required>
                        <option value="">-- Selecciona Región --</option>
                    </select>
                    <span class="error-msg" id="errorRegion"></span>
                </div>
                <div class="form-group">
                    <label for="selectComuna">Comuna:</label>
                    <select id="selectComuna" name="comuna" disabled required>
                        <option value="">-- Selecciona Comuna --</option>
                    </select>
                    <span class="error-msg" id="errorComuna"></span>
                </div>
            </div>

            <div class="form-group">
                <label for="codigoPromo">Código Promocional (Opcional):</label>
                <input type="text" id="codigoPromo" name="codigoPromo" placeholder="Ej: FELICES50">
            </div>

            <button type="submit" class="btn-submit">Registrarse</button>
        </form>

        <div id="resultadoBeneficios" class="beneficios-card hidden">
            <h3>¡Registro Exitoso!</h3>
            <p id="mensajeCliente"></p>
            <ul id="listaBeneficios"></ul>
        </div>
    </main>

    <script src="js/regiones-comunas.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
